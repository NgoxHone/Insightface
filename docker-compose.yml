version: '3.8'

services:
  face-recognition-api:
    build: .
    container_name: face-recognition-api
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - RECOGNITION_THRESHOLD=${RECOGNITION_THRESHOLD:-0.6}
      - DETECTION_THRESHOLD=${DETECTION_THRESHOLD:-0.5}
      - ENABLE_QUALITY_CHECK=${ENABLE_QUALITY_CHECK:-true}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./trained_models:/app/trained_models
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: pgAdmin or other tools
